# 允许 Argo 工作流以 arcjob SA 运行后，对 spark 命名空间中的 pod 做 patch/update
# （Argo 在步骤完成后会给 pod 打注解记录输出，缺该权限会导致 Workflow 被标为 Error）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arcjob-workflow-role
  namespace: spark
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arcjob-workflow-rb
  namespace: spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arcjob-workflow-role
subjects:
- kind: ServiceAccount
  name: arcjob
  namespace: spark
